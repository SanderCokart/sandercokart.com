# Enables reading Node and pnpm versions from package.json (single source of truth).
# See: https://mise.jdx.dev/configuration.html#idiomatic-version-files
min_version = "2024.11.1"

[tools]
php = "8.5"
# Checksums + SLSA still run. GitHub attestations currently fail TSA timestamp
# verification on OpenBao releases (false negative), which blocks the install.
openbao = { version = "latest", github_attestations = false }

[settings]
idiomatic_version_file_enable_tools = ["node", "pnpm"]
