services:
    api:
        profiles: [development, production]
        tty: true
        env_file:
            - .env
        build:
            dockerfile: apps/api/Dockerfile
            context: ../../
            target: production
            args:
                USER_ID: ${USER_ID}
                GROUP_ID: ${GROUP_ID}
        restart: unless-stopped
        depends_on:
            - db
            - redis
        environment:
            AUTORUN_ENABLED: true
            HEALTHCHECK_PATH: /health
            MAIL_RENDERER_URL: http://mail-renderer:4010
        healthcheck:
            test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
            interval: 30s
            timeout: 10s
            retries: 3
    queue:
        profiles: [development, production]
        env_file:
            - .env
        build:
            dockerfile: apps/api/Dockerfile
            context: ../../
            target: queue
        restart: unless-stopped
        stop_signal: SIGTERM
        depends_on:
            db:
                condition: service_healthy
            mail-renderer:
                condition: service_healthy
        environment:
            MAIL_RENDERER_URL: http://mail-renderer:4010
        healthcheck:
            test: ["CMD", "pgrep", "-f", "queue:work"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 20s
    mail-renderer:
        profiles: [development, production]
        build:
            dockerfile: apps/mail-renderer/Dockerfile
            context: ../../
        restart: unless-stopped
        ports:
            - "4010:4010"
        environment:
            NODE_ENV: production
            PORT: 4010
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://127.0.0.1:4010/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
    redis:
        profiles: [development, production]
        restart: unless-stopped
        image: 'redis:8.4-alpine'
        command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
        env_file:
            - .env
        healthcheck:
            test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
            interval: 30s
            timeout: 10s
            retries: 3
        volumes:
            - 'redis-data:/data'
    db:
        profiles: [development, production]
        restart: unless-stopped
        image: 'mariadb:11'
        env_file:
            - .env
        environment:
            MARIADB_ROOT_HOST: '%'
            MARIADB_DATABASE: '${DB_DATABASE}'
            MARIADB_USER: '${DB_USERNAME}'
            MARIADB_PASSWORD: '${DB_PASSWORD}'
            MARIADB_ROOT_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'mariadb-data:/var/lib/mysql'
            - './vendor/laravel/sail/database/mariadb/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        healthcheck:
            test:
                - CMD
                - healthcheck.sh
                - '--connect'
                - '--innodb_initialized'
            retries: 3
            timeout: 5s
    mailpit:
        profiles: [development]
        restart: unless-stopped
        image: 'axllent/mailpit:latest'
        ports:
            - '1025:1025'
            - '8025:8025'
            
volumes:
    mariadb-data:
        driver: local
    redis-data:
        driver: local

